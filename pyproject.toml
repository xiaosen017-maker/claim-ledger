[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "claim-ledger"
version = "0.1.0"
description = "Citation integrity checks and evidence ledgers for research manuscripts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "xiaosen017-maker" }]
keywords = ["research", "citation", "bibtex", "markdown", "latex", "integrity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing",
]

[project.scripts]
claim-ledger = "claim_ledger.cli:main"

[project.urls]
Repository = "https://github.com/xiaosen017-maker/claim-ledger"
Issues = "https://github.com/xiaosen017-maker/claim-ledger/issues"
Changelog = "https://github.com/xiaosen017-maker/claim-ledger/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/claim_ledger"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
