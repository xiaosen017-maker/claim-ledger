name: Syntax or workflow proposal
description: Propose a citation syntax, evidence rule, or report improvement.
title: "proposal: "
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: Research workflow
      description: Explain the manuscript format and the review problem.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Minimal synthetic example
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: False-positive boundary
      description: Explain when the proposed behavior should not trigger.
