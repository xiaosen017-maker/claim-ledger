name: Bug report
description: Report a reproducible parser or report error.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use a minimal synthetic excerpt. Do not paste confidential or unpublished manuscripts.
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a small manuscript excerpt, BibTeX excerpt, command, and observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

